# A pushed version tag (v1.8.0) builds, tests and packs NeoFences and uploads it as a DRAFT release (M17, ADR-039).
# The draft is installed and checked on the developer PC, then published; only then do installed copies update.
# A release candidate (v1.0.0-rc.1, ADR-062) is uploaded as a GitHub pre-release: stable copies never see it (they skip
# pre-releases), and only release candidates follow it. Other pre-release tags (v1.9.0-beta) still start nothing (final
# review M5).
name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+']
permissions:
  contents: write # the draft release; the workflow's own token, no stored secret
  id-token: write # M39 (ADR-061): build attestations, signed by GitHub
  attestations: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # every tag: the release notes list the commits since the previous one
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Version from the tag
        id: version
        shell: pwsh
        run: '"version=$("${{ github.ref_name }}".TrimStart("v"))" >> $env:GITHUB_OUTPUT'
      - name: Previous release (makes a small delta update)
        shell: pwsh
        continue-on-error: true # none before the first release
        run: |
          dotnet tool restore
          dotnet vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}" --outputDir artifacts/releases
      - name: Release notes (feat and fix commits since the previous tag)
        shell: pwsh
        run: |
          $previous = git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>$null
          $range = if ($previous) { "$previous..${{ github.ref_name }}" } else { "${{ github.ref_name }}" }
          $lines = git log $range --format='%s' | Where-Object { $_ -match '^(feat|fix):' } | ForEach-Object { '- ' + ($_ -replace '^(feat|fix):\s*', '') }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Set-Content artifacts/release-notes.md -Encoding utf8 -Value (@("## NeoFences ${{ github.ref_name }}", '') + $lines)
      - name: Build, test and pack
        shell: pwsh
        run: ./build/pack.ps1 -Version "${{ steps.version.outputs.version }}" -ReleaseNotes artifacts/release-notes.md
      # Stage 2 (ADR-039): code signing goes here (vpk pack --signParams / --azureTrustedSignFile) once a certificate exists.
      # M39 (ADR-061): unsigned, so every download can be checked instead — its SHA-256 and GitHub's build attestation.
      # Only this version's files (artifacts/releases also holds the previous release, downloaded for the delta), and not
      # releases.win.json / RELEASES: vpk upload rewrites those with the earlier releases, so their hashes would not match.
      - name: Checksums
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $names = @("NeoFences.App-$version-full.nupkg", "NeoFences.App-$version-delta.nupkg", 'NeoFences.App-win-Setup.exe', 'NeoFences.App-win-Portable.zip')
          $lines = foreach ($name in $names) {
            $path = Join-Path artifacts/releases $name
            if (Test-Path -LiteralPath $path) { "$((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant())  $name" }
          }
          Set-Content artifacts/SHA256SUMS.txt -Value $lines -Encoding ascii
          Get-Content artifacts/SHA256SUMS.txt
      - name: Build attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/releases/NeoFences.App-${{ steps.version.outputs.version }}-*.nupkg
            artifacts/releases/NeoFences.App-win-Setup.exe
            artifacts/releases/NeoFences.App-win-Portable.zip
      - name: Upload as a draft release
        shell: pwsh
        run: |
          $candidate = @(if ("${{ github.ref_name }}" -like '*-rc.*') { '--pre' }) # ADR-062: a release candidate is a pre-release
          dotnet vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}" --outputDir artifacts/releases --tag "${{ github.ref_name }}" --releaseName "NeoFences ${{ github.ref_name }}" @candidate
      - name: Upload the checksums to the draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" artifacts/SHA256SUMS.txt --clobber --repo "${{ github.repository }}"
